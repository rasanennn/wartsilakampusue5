<!DOCTYPE html>
<html>
<head>
    <title>Unreal Engine Communication Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 5px;
            margin-bottom: 10px;
        }
        button {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <h1>Messages</h1>
    <ul id="messageList">
        <li>Hello from the web page! t. Ari Asiakas</li>
        <li>This is a mock-up message. t. Marko Mockupmies</li>
        <li>Supposedly loaded from an external service or database. t. Viestin lähettäjä</li>
    </ul>

    <input type="text" id="messageInput" placeholder="Enter your message">
    <button onclick="sendMessageToUnreal()">Send to Unreal Engine</button>

    <script>
function sendMessageToUnreal() {
    var message = document.getElementById('messageInput').value;
    if (message.trim() !== '') {
        try {
            window.ue.bridge.handlebuttonclick(message);
            document.getElementById('messageInput').value = '';
            updateConsoleOutput('Message sent to Unreal Engine: ' + message);
        } catch (error) {
            updateConsoleOutput('Error: ' + error.message);
        }
    }
}

function updateConsoleOutput(message) {
    var consoleOutput = document.getElementById('consoleOutput');
    if (!consoleOutput) {
        consoleOutput = document.createElement('div');
        consoleOutput.id = 'consoleOutput';
        consoleOutput.style.marginTop = '10px';
        document.body.appendChild(consoleOutput);
    }
    consoleOutput.textContent = message;
}
    </script>
</body>
</html>
